[project]
name = "radiotrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pythonpanda", email = "dev@pythonpandastudios.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg>=3.3.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
radiotrack = "radiotrack:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "spyder-kernels>=3.1.6,<3.2",
]
